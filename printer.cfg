#####################################################################
#   Voron Design VORON2 300mm Spider TMC2209 UART config
#####################################################################

[include mainsail.cfg]

[mcu]
serial: /dev/serial0
restart_method: command

[mcu host]
serial: /tmp/klipper_host_mcu

[printer]
kinematics:             corexy
max_velocity:           300
max_accel:              4000
minimum_cruise_ratio:   0.5
max_z_velocity:         70
max_z_accel:            700
square_corner_velocity: 5

[idle_timeout]
timeout: 900 # 15 minutes
gcode:
    TURN_OFF_HEATERS
    STATUS_OFF
    NOZZLE_LEDS_OFF
    CHAMBERLIGHT_OFF
    ENTER_IDLE

[gcode_arcs]
resolution: 0.05

[respond]

[pause_resume]

[exclude_object]

#####################################################################
#   Motors
#####################################################################

[include motors.cfg]

#####################################################################
#   Extruder
#####################################################################

[include extruder.cfg]

#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin:     PB4
sensor_type:    NTC 100K MGB18-104F39050L32
sensor_pin:     PB0
min_temp:       0
max_temp:       120
pwm_cycle_time: 0.3
control:        pid
pid_kp:         63.810
pid_ki:         3.298
pid_kd:         308.683

#####################################################################
#    Temperature / Fan Control
#####################################################################

# Hotend Fan
[heater_fan hotend_fan]
pin:                PA14
heater:             extruder
heater_temp:        50.0
shutdown_speed:     1.0

# Part cooling Fan
[fan]
pin:                PA13
off_below:          0.1
kick_start_time:    0.5
shutdown_speed:     0.0

# Electronics compartment Fan
[controller_fan electronics_fan]
pin:                PB2
heater:             extruder,heater_bed
stepper:            stepper_z,stepper_z1,stepper_z2,stepper_z3,stepper_x,stepper_y
shutdown_speed:     0.0
idle_speed:         0.4
idle_timeout:       300   # 5 minutes

# Chamber Thermistor
[thermistor NTC_10K]
temperature1: 25
resistance1: 15000
beta: 3960

# Chamber Temperature Sensor
[temperature_sensor chamber]
sensor_type: NTC_10K
sensor_pin:  PC0
# min_temp:    10
# max_temp:    110
gcode_id: C

# Raspberry Pi Core Temperature Sensor
[temperature_sensor Host]
sensor_type: temperature_host
max_temp: 80

# # Spider MCU Core Temperature Sensor
# [temperature_sensor MCU]
# sensor_type: temperature_mcu
# max_temp: 80

#####################################################################
#    Homing, Gantry and Bed Adjustments
#####################################################################

[safe_z_home]
home_xy_position:   150,150
speed:              25
z_hop_speed:        25
z_hop:              10

##--------------------------------------------------------------------

[probe]
pin:                        ^PA3
z_offset:                   -1.450
speed:                      5
samples:                    3
sample_retract_dist:        4.0
samples_tolerance:          0.05
samples_tolerance_retries:  3
activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set STABILITY_TOLERANCE = 5.0 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target|float %}
    {% set CALIBRATION_TEMP = TARGET_TEMP if TARGET_TEMP >= PROBE_TEMP else PROBE_TEMP %}
    {% set MIN_STABLE_TEMP = CALIBRATION_TEMP - STABILITY_TOLERANCE %}
    {% set MAX_STABLE_TEMP = CALIBRATION_TEMP + STABILITY_TOLERANCE %}

    {% if TARGET_TEMP < PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is below the minimum, raising it to %.1fC' % (TARGET_TEMP, CALIBRATION_TEMP)) }
        M109 S{ CALIBRATION_TEMP }
    {% else %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={ MIN_STABLE_TEMP } MAXIMUM={ MAX_STABLE_TEMP }
    {% endif %}

##--------------------------------------------------------------------

[quad_gantry_level]
gantry_corners:
    -60,-10
    360,370
points:
    50,25
    50,225
    250,225
    250,25
speed:              300
horizontal_move_z:  5
retries:            5
retry_tolerance:    0.0075
max_adjust:         10

##--------------------------------------------------------------------

[bed_mesh]
speed: 300
horizontal_move_z: 5
mesh_min: 40, 40
mesh_max: 260, 260
fade_start: 0.3
fade_end: 0.65
probe_count: 7,7
algorithm: bicubic

#####################################################################
#    Filament
#####################################################################
[filament_switch_sensor unklicky]
switch_pin: ^PC1
pause_on_runout: TRUE
event_delay: 3.0
pause_delay: 0.5
insert_gcode:
    M117 Insert Detected
runout_gcode:
    M117 Runout Detected

#####################################################################
#    Resonance
#####################################################################

[adxl345]
cs_pin: host:None
axes_map: z, y, x

[resonance_tester]
accel_chip: adxl345
probe_points:
    150, 150, 20

[input_shaper]
# Measured on 2026-06-01 15:34:53
shaper_freq_x: 106.8
shaper_type_x: ei
shaper_freq_y: 59.2
shaper_type_y: ei

#####################################################################
#    Macros
#####################################################################

[include macros_lights.cfg]
[include macros.cfg]

#####################################################################
#    Lights
#####################################################################

[output_pin chamberlight]
# Chamber lights
pin:            PB3
pwm:            true
shutdown_value: 0
cycle_time:     0.001

[neopixel sb_leds]
# Toolhead leds
pin: PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.2
initial_BLUE: 0.4
initial_WHITE: 0.0
