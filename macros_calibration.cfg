[gcode_macro SET_CALIBRATION_TEMP]
variable_extruder_calibration_temp: 150

gcode:
    {% set EXTRUDER = params.EXTRUDER %}
    {% set BED = params.BED %}
    {% set WAIT = params.WAIT|default(1)|int %}

    ; Set extruder first, because it takes longer then the bed to heat up
    {% if EXTRUDER is defined %}
        {% set EXTRUDER_TEMP = 0 if EXTRUDER == '0' else extruder_calibration_temp %}

        M104 S{EXTRUDER_TEMP}         ; Set extruder temperature
    {% endif %}

    {% if BED is defined %}
        {% set BED_TEMP = 0 if BED == '0' else printer.heater_bed.target|float %}

        M140 S{BED_TEMP}

        {% if BED_TEMP > 0 and WAIT %}
            M190 S{BED_TEMP}
            ; Wait 20s for the temperature to become stable
            M117 Waiting 20s Bed temperature to settle({BED_TEMP}C)...
            G4 P10000
            M117 Waiting 10s Bed temperature to settle({BED_TEMP}C)...
            G4 P10000
        {% endif %}
    {% endif %}

    {% if EXTRUDER_TEMP is defined and WAIT %}
        {% if EXTRUDER_TEMP > 0 %}
            M117 Setting Extruder temperature: {EXTRUDER_TEMP}C...
        {% endif %}
        M106 S255
        M109 S{EXTRUDER_TEMP}    ; Wait for Extruder
        M106 S0
    {% endif %}


[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_
gcode:
    {% set bed_target = printer.heater_bed.target|float %}
    {% set extruder_target = printer.extruder.target|float %}

    {% if not 'xyz' in printer.toolhead.homed_axes %}
        { action_raise_error("Must Home X, Y and Z Axis First!") }
    {% endif %}

    M117 Bed mesh calibrating

    SET_CALIBRATION_TEMP EXTRUDER=1 BED=1
    STATUS_MESHING
    BED_MESH_CALIBRATE_ {rawparams}
    M104 S{extruder_target}
    M140 S{bed_target}

    M117 Ready
    STATUS_READY

[gcode_macro PROBE_ACCURACY]
rename_existing: PROBE_ACCURACY_
description:Probe Z-height accuracy at bed center
gcode:
    {% if not 'xyz' in printer.toolhead.homed_axes %}
        { action_raise_error("Must Home X, Y and Z Axis First!") }
    {% endif %}

    M_CENTER

    PROBE_ACCURACY_ {% for p in params
            %}{'%s=%s ' % (p, params[p])}{%
            endfor %}

[gcode_macro PROBE_CALIBRATE]
rename_existing: PROBE_CALIBRATE_
gcode:
    {% if not 'xyz' in printer.toolhead.homed_axes %}
        { action_raise_error("Must Home X, Y and Z Axis First!") }
    {% endif %}

    STATUS_CALIBRATING_Z
    M_CENTER

    PROBE_CALIBRATE_ {% for p in params
            %}{'%s=%s ' % (p, params[p])}{%
            endfor %}
